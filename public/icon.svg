<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a9" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a6845" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="100%" stop-color="#12141a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Outer subtle circular orbit -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4" />

  <!-- Shield Base for Security -->
  <path d="M256 80 L370 130 C370 240 320 335 256 385 C192 335 142 240 142 130 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Aperture / Camera Lens Iris in center -->
  <g transform="translate(256, 230)">
    <!-- Lens outer ring -->
    <circle cx="0" cy="0" r="76" fill="#15171e" stroke="url(#goldGrad)" stroke-width="4" />
    <!-- Aperture blades -->
    <path d="M0 -76 L40 -40 L25 -10 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M65 -38 L70 15 L35 15 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M65 38 L25 70 L5 38 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M0 76 L-40 40 L-25 10 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M-65 38 L-70 -15 L-35 -15 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M-65 -38 L-25 -70 L-5 -38 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Center aperture core -->
    <circle cx="0" cy="0" r="28" fill="#090a0d" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="12" fill="#d4af37" />
  </g>

  <!-- Google Verified Check Badge at bottom right of shield -->
  <g transform="translate(330, 310)">
    <!-- Verified Badge circular seal -->
    <path d="M 0 -24 L 7 -22 L 17 -17 L 22 -7 L 24 0 L 22 7 L 17 17 L 7 22 L 0 24 L -7 22 L -17 17 L -22 7 L -24 0 L -22 -7 L -17 -17 L -7 -22 Z" fill="#1a73e8" filter="url(#glow)" />
    <!-- Inner checkmark -->
    <path d="M -9 0 L -3 6 L 9 -6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Keyhole / 2FA indicator under shield -->
  <path d="M256 410 L268 435 L244 435 Z" fill="url(#goldGrad)" opacity="0.7" />

  <!-- Studio Monogram EM -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#f0e6d6" opacity="0.95">ENDLESS MOMENT</text>
</svg>
